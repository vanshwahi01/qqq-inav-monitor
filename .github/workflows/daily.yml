name: Daily iNAV update

on:
  schedule:
    - cron: "30 22 * * 1-5"  # 22:30 UTC on weekdays, after the US close
  workflow_dispatch:          # lets you trigger a run from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tests
        run: pytest -q

      - name: Calculate iNAV and rebuild dashboard
        run: python -m inav daily

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs README.md
          git diff --cached --quiet || git commit -m "Daily iNAV update $(date -u +%F)"
          git push
